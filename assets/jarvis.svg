<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="420" fill="url(#bg)"/>

<g transform="translate(230,210)" filter="url(#glow)">
  <circle r="95" fill="none" stroke="#00E7FF" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate"
      from="0" to="360" dur="10s" repeatCount="indefinite"/>
  </circle>

  <circle r="65" fill="none" stroke="#38BDF8" stroke-width="5">
    <animateTransform attributeName="transform" type="rotate"
      from="360" to="0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle r="10" fill="#00E7FF">
    <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
  </circle>
</g>

<g font-family="JetBrains Mono" transform="translate(470,90)">
  <text x="0" y="20" font-size="42" fill="#00E7FF" filter="url(#glow)">YOGRAJ.EXE</text>
  <text x="0" y="55" font-size="18" fill="#7DD3FC">Backend Engineer • Java • Spring Boot</text>

  <text x="0" y="100" font-size="18" fill="#00E7FF">SYSTEM STATUS</text>

  <rect x="0" y="120" width="280" height="8" rx="4" fill="#123"/>
  <rect x="0" y="120" width="280" height="8" rx="4" fill="#00E7FF">
    <animate attributeName="width" values="0;280;250;280" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="0" y="160" font-size="16" fill="#E2E8F0">Java Runtime ............ 100%</text>
  <text x="0" y="190" font-size="16" fill="#E2E8F0">Spring Boot ............ ONLINE</text>
  <text x="0" y="220" font-size="16" fill="#E2E8F0">Redis Cache ............ READY</text>
  <text x="0" y="250" font-size="16" fill="#E2E8F0">REST APIs .............. ACTIVE</text>
</g>

<g font-family="JetBrains Mono" transform="translate(470,320)">
  <text x="0" y="0" font-size="16" fill="#00E7FF">$ boot Yograj.EXE</text>
  <text x="0" y="28" font-size="15" fill="#E2E8F0">Initializing...
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </text>
</g>
</svg>
